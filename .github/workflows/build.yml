name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create --org com.example --project-name elnaseh_app .

      - name: Get dependencies
        run: flutter pub get

      - name: Disable Lint
        run: |
          sed -i 's/android {/android {\n    lint { checkReleaseBuilds false; abortOnError false }/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elnaseh-APK
          path: build/app/outputs/flutter-apk/app-release.apk
